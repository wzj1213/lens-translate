<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="readerTitle">Lens Reader</title><link rel="stylesheet" href="reader.css"></head>
<body>
<header><h1 id="title" data-i18n="readerTitle">Lens Reader</h1><div class="tools"><label class="file"><span data-i18n="readerOpen">Open file</span><input id="file" type="file" accept=".pdf,image/*"></label><button id="settings" type="button" data-i18n="openOptions">Settings</button></div></header>
<main>
  <p id="status" role="status" aria-live="polite" data-i18n="readerStart">Choose a PDF or an image.</p>
  <nav id="pages" hidden><button id="prev" type="button" data-i18n="readerPrev">Previous page</button><output id="pageNumber"></output><button id="next" type="button" data-i18n="readerNext">Next page</button></nav>
  <div id="workspace" hidden>
    <section id="preview" aria-label="Preview"><div id="sheet"><canvas id="canvas"></canvas><div id="regions"></div></div><img id="image" alt="" hidden></section>
    <section id="reading"><div id="ocrControls" hidden><label><span data-i18n="ocrLanguage">Text in the image</span><select id="ocrLang"><option value="eng">English</option><option value="chi_sim">简体中文 + English</option><option value="jpn">日本語 + English</option></select></label><button id="recognize" type="button" data-i18n="ocrRead">Recognize again</button></div>
    <h2 data-i18n="readerOriginal">Original</h2><textarea id="source" rows="5" data-i18n-aria="readerOriginal"></textarea>
    <button id="translate" type="button" class="primary" data-i18n="readerTranslate">Translate text</button>
    <h2 data-i18n="readerResult">Translation</h2><div id="result" aria-live="polite"></div></section>
  </div>
</main><script type="module" src="reader.js"></script></body></html>
